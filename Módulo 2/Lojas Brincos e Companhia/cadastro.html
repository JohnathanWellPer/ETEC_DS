<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Lojas Brincos e Companhia</title>
</head>
<body>

    <h2>Cadastro de Novos Colaboradores</h2>
    
    <!-- O formulário com action e method definidos -->
    <form action="processaCadastro.php" method="POST">
        
        <label>Nome Completo:</label><br>
        <input type="text" name="nome1" required><br><br>

        <label>Idade:</label><br>
        <input type="number" name="idade2" required><br><br>

        <label>Profissão:</label><br>
        <input type="text" name="profissao3" required><br><br>

        <label>Salário Pretendido (R$):</label><br>
        <input type="number" step="0.01" name="salario4" required><br><br>

        <label>Experiência Anterior:</label><br>
        <!-- Textarea atende ao requisito de "texto longo" -->
        <textarea name="experiencia5" rows="5" required></textarea><br><br>

        <button type="submit">Enviar Cadastro</button>

    </form>

</body>
</html>
